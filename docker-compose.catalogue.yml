name: gthdf-catalogue-prd04

services:
  postgres-catalogue:
    image: postgres:16-alpine
    container_name: gthdf-catalogue-prd04-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gthdf_catalogue
      POSTGRES_USER: gthdf
      POSTGRES_PASSWORD: gthdf
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - gthdf_catalogue_prd04_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gthdf -d gthdf_catalogue"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-catalogue:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: gthdf-catalogue-prd04-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gthdf
      MINIO_ROOT_PASSWORD: gthdfpassword
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - gthdf_catalogue_prd04_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init-catalogue:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: gthdf-catalogue-prd04-minio-init
    depends_on:
      minio-catalogue:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set catalogue http://minio-catalogue:9000 gthdf gthdfpassword;
        mc mb --ignore-existing catalogue/gthdf-catalogue-media;
        mc anonymous set download catalogue/gthdf-catalogue-media

volumes:
  gthdf_catalogue_prd04_postgres:
    name: gthdf_catalogue_prd04_postgres
  gthdf_catalogue_prd04_minio:
    name: gthdf_catalogue_prd04_minio
