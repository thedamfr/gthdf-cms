name: GTHF delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gthdf-cms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: git diff --check

  delivery:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: application
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thedamfr/gthdf-frontend
          ref: main
          path: deployer
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Join the deployment tailnet using workload identity
        if: vars.GTHDF_DELIVERY_ENABLED == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-deploy
          ping: penthouse.taild95457.ts.net
      - name: Install the dedicated SSH identity
        if: vars.GTHDF_DELIVERY_ENABLED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GTHDF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GTHDF_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Install the pinned Ansible runner
        if: vars.GTHDF_DELIVERY_ENABLED == 'true'
        run: python3 -m pip install -r deployer/infrastructure/ansible/requirements.txt
      - name: Select, publish, qualify and promote the release
        env:
          GTHDF_DELIVERY_ENABLED: ${{ vars.GTHDF_DELIVERY_ENABLED }}
          GTHDF_SSH_TARGET: ubuntu@penthouse.taild95457.ts.net
        run: node deployer/infrastructure/delivery/ci.mjs cms "$GITHUB_WORKSPACE/application" "$GITHUB_WORKSPACE/deployer"
      - name: Preserve the release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gthdf-cms-release-${{ github.sha }}
          path: ${{ runner.temp }}/gthdf-release/
          if-no-files-found: warn
          retention-days: 30

  result:
    name: delivery-result
    if: always()
    needs: [quality, delivery]
    runs-on: ubuntu-latest
    steps:
      - name: Require all expected jobs to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          DELIVERY: ${{ needs.delivery.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          test "$QUALITY" = success
          if [ "$EVENT" = pull_request ] || [ "$REF" != refs/heads/main ]; then
            test "$DELIVERY" = skipped
          else
            test "$DELIVERY" = success
          fi
